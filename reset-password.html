<!DOCTYPE html>
<html lang="sr">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Resetovanje lozinke - FirstCode</title>
	<meta name="description" content="Postavite novu lozinku za vaš FirstCode nalog.">
	<link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700" rel="stylesheet">
	<link type="text/css" rel="stylesheet" href="css/bootstrap.min.css"/>
	<link type="text/css" rel="stylesheet" href="css/slick.css"/>
	<link type="text/css" rel="stylesheet" href="css/slick-theme.css"/>
	<link type="text/css" rel="stylesheet" href="css/nouislider.min.css"/>
	<link rel="stylesheet" href="css/font-awesome.min.css">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<link rel="manifest" href="site.webmanifest">
	<link type="text/css" rel="stylesheet" href="css/style.css"/>
	<style>
		.auth-section { padding: 60px 0 80px; background: #f5f7fa; min-height: calc(100vh - 200px); }
		.auth-card {
			background: #fff; border-radius: 8px;
			box-shadow: 0 2px 20px rgba(0,0,0,0.08);
			padding: 40px 40px 36px; max-width: 440px; margin: 0 auto;
		}
		.auth-card h2 { font-size: 22px; font-weight: 700; color: #293681; margin: 0 0 6px; }
		.auth-card .auth-subtitle { color: #888; font-size: 14px; margin-bottom: 28px; }
		.auth-card .form-group { margin-bottom: 18px; }
		.auth-card label { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; display: block; }
		.auth-card .form-control {
			height: 44px; border-radius: 4px; border: 1px solid #ddd;
			font-size: 14px; padding: 0 14px; width: 100%; box-sizing: border-box; transition: border-color .2s;
		}
		.auth-card .form-control:focus { border-color: #4274D9; outline: none; box-shadow: 0 0 0 3px rgba(66,116,217,0.1); }
		.auth-btn {
			width: 100%; height: 46px; background: #293681; color: #fff;
			border: none; border-radius: 4px; font-size: 15px; font-weight: 600;
			cursor: pointer; margin-top: 6px; transition: background .2s;
		}
		.auth-btn:hover { background: #1e2756; }
		.auth-btn:disabled { opacity: .6; cursor: not-allowed; }
		.auth-links { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
		.auth-links a { color: #4274D9; text-decoration: none; font-weight: 600; }
		.auth-alert {
			padding: 12px 14px; border-radius: 4px; font-size: 13px;
			margin-bottom: 18px; display: none;
		}
		.auth-alert.error { background: #fff0f0; border: 1px solid #ffcccc; color: #c0392b; }
		.auth-alert.success { background: #f0fff4; border: 1px solid #b2dfdb; color: #1a6b4a; }
		.pass-wrap { position: relative; }
		.pass-toggle {
			position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
			background: none; border: none; cursor: pointer; color: #999; padding: 0;
		}
		.pass-toggle:hover { color: #4274D9; }
		@media(max-width:480px) { .auth-card { padding: 28px 18px 24px; } }
	</style>
</head>
<body>
	<header>
		<div id="top-header">
			<div class="container">
				<ul class="header-links pull-right">
					<li><a href="login.html" id="nav-account-link"><i class="fa fa-user-o"></i> <span id="nav-account-label">Moj nalog</span></a></li>
				</ul>
			</div>
		</div>
		<div id="header">
			<div class="container">
				<div class="row">
					<div class="col-md-3">
						<div class="header-logo">
							<a href="index.html" class="logo"><img src="./img/logo.svg" alt="FirstCode"></a>
						</div>
					</div>
					<div class="col-md-3 col-md-offset-6 clearfix">
						<div class="header-ctn">
							<div class="menu-toggle"><a href="#"><i class="fa fa-bars"></i><span>Meni</span></a></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</header>

	<div class="auth-section">
		<div class="container">
			<div class="auth-card">
				<h2><i class="fa fa-key" style="color:#4274D9;margin-right:8px;"></i>Nova lozinka</h2>
				<p class="auth-subtitle">Postavite novu lozinku za vaš nalog.</p>

				<div id="auth-alert" class="auth-alert"></div>

				<div id="invalid-token-msg" style="display:none;text-align:center;padding:16px 0;">
					<i class="fa fa-exclamation-circle" style="font-size:36px;color:#e74c3c;margin-bottom:12px;display:block;"></i>
					<p style="color:#444;font-size:14px;">Link za resetovanje lozinke je nevažeći ili je istekao.</p>
					<a href="forgot-password.html" class="auth-btn" style="display:inline-block;margin-top:14px;text-decoration:none;text-align:center;padding:12px 24px;width:auto;">
						Zatraži novi link
					</a>
				</div>

				<div id="reset-success" style="display:none;text-align:center;padding:16px 0;">
					<div style="width:60px;height:60px;margin:0 auto 14px;background:#f0fff4;border-radius:50%;display:flex;align-items:center;justify-content:center;">
						<i class="fa fa-check" style="font-size:26px;color:#27ae60;"></i>
					</div>
					<p style="color:#444;font-size:14px;line-height:1.6;">Lozinka je uspješno promijenjena!</p>
					<a href="login.html" class="auth-btn" style="display:inline-block;margin-top:14px;text-decoration:none;text-align:center;padding:12px 24px;width:auto;">
						<i class="fa fa-sign-in"></i> Prijavite se
					</a>
				</div>

				<form id="reset-form" novalidate>
					<div class="form-group">
						<label for="newPassword">Nova lozinka</label>
						<div class="pass-wrap">
							<input type="password" class="form-control" id="newPassword" placeholder="Najmanje 8 znakova" autocomplete="new-password" required>
							<button type="button" class="pass-toggle" data-target="newPassword" tabindex="-1"><i class="fa fa-eye"></i></button>
						</div>
					</div>
					<div class="form-group">
						<label for="confirmPassword">Potvrda lozinke</label>
						<div class="pass-wrap">
							<input type="password" class="form-control" id="confirmPassword" placeholder="Ponovite lozinku" autocomplete="new-password" required>
							<button type="button" class="pass-toggle" data-target="confirmPassword" tabindex="-1"><i class="fa fa-eye"></i></button>
						</div>
					</div>
					<button type="submit" class="auth-btn" id="reset-btn">
						<i class="fa fa-save"></i> Sačuvaj lozinku
					</button>
				</form>
			</div>
		</div>
	</div>

	<footer id="footer">
		<div id="bottom-footer" class="section">
			<div class="container">
				<div class="row">
					<div class="col-md-12 text-center">
						<span class="copyright">© 2026 FirstCode. Sva prava zadržana.</span>
					</div>
				</div>
			</div>
		</div>
	</footer>

	<script src="js/jquery.min.js"></script>
	<script src="js/bootstrap.min.js"></script>
	<script src="js/config.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/main.js"></script>
	<script>
	(function ($) {
		'use strict';
		$(document).ready(function () {
			var token = new URLSearchParams(window.location.search).get('token');
			if (!token) {
				$('#reset-form').hide();
				$('#invalid-token-msg').show();
				return;
			}

			// Password visibility toggle
			$(document).on('click', '.pass-toggle', function () {
				var id = $(this).data('target');
				var $inp = $('#' + id);
				$inp.attr('type', $inp.attr('type') === 'password' ? 'text' : 'password');
				$(this).find('i').toggleClass('fa-eye fa-eye-slash');
			});

			$('#reset-form').on('submit', function (e) {
				e.preventDefault();
				var newPassword     = $('#newPassword').val();
				var confirmPassword = $('#confirmPassword').val();

				if (newPassword.length < 8) {
					showAlert('Lozinka mora imati najmanje 8 znakova.', 'error');
					return;
				}
				if (newPassword !== confirmPassword) {
					showAlert('Lozinke se ne podudaraju.', 'error');
					return;
				}

				var $btn = $('#reset-btn').prop('disabled', true).text('Čuvanje...');
				AuthService.resetPassword(token, newPassword)
					.then(function () {
						$('#reset-form').hide();
						$('#reset-success').show();
					})
					.catch(function (err) {
						$btn.prop('disabled', false).html('<i class="fa fa-save"></i> Sačuvaj lozinku');
						var msg = err.message || 'Greška. Token možda nije validan.';
						showAlert(msg, 'error');
					});
			});
		});

		function showAlert(msg, type) {
			$('#auth-alert').removeClass('error success').addClass(type).text(msg).show();
		}
	})(jQuery);
	</script>
</body>
</html>
